<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMA EORE Overview Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #122A3D; --amber: #D97706; --teal: #2F9D81; --red: #B91C1C;
    --bg: #F4F6F5; --card: #FFFFFF; --muted: #64748B; --border: #E2E6E4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: #1A2733; }
  header { background: linear-gradient(135deg, #0D2235 0%, #122A3D 60%, #163449 100%); color: #F7F8F5; padding: 28px 36px; }
  header h1 { margin: 0 0 4px; font-size: 26px; font-weight: 700; }
  header p { margin: 0; font-size: 14px; color: #9FB4C4; }
  main { padding: 28px 36px 60px; max-width: 1600px; margin: 0 auto; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; }
  .kpi-card .label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
  .kpi-card .value { font-size: 36px; font-weight: 700; color: var(--navy); }
  .kpi-card .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
  .panel h3 { margin: 0 0 14px; font-size: 16px; font-weight: 700; color: var(--navy); }
  canvas { max-height: 320px; }
</style>
</head>
<body>
<header>
  <h1>SEMA EORE Overview Dashboard</h1>
  <p>Explosive Ordnance Risk Education reach and activity across Somalia</p>
</header>
<main>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="grid-2">
    <div class="panel">
      <h3>Beneficiaries reached per year</h3>
      <canvas id="yearChart"></canvas>
    </div>
    <div class="panel">
      <h3>Beneficiaries by gender</h3>
      <canvas id="genderChart"></canvas>
    </div>
  </div>

  <div class="grid-3">
    <div class="panel">
      <h3>Top EORE methods</h3>
      <canvas id="methodChart"></canvas>
    </div>
    <div class="panel">
      <h3>Beneficiaries by implementing partner</h3>
      <canvas id="orgChart"></canvas>
    </div>
    <div class="panel">
      <h3>Beneficiaries by Federal Member State</h3>
      <canvas id="stateChart"></canvas>
    </div>
  </div>

</main>

<script>
function kpiCard(label, value, sub) {
  const div = document.createElement('div');
  div.className = 'kpi-card';
  div.innerHTML = '<div class="label">' + label + '</div><div class="value">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '');
  return div;
}

function topN(arr, n) {
  return arr.slice().sort((a, b) => b.value - a.value).slice(0, n);
}

async function init() {
  let data;
  try {
    const res = await fetch('/api/dashboards/eore-overview');
    if (!res.ok) throw new Error('Backend returned ' + res.status);
    data = await res.json();
  } catch (err) {
    console.error('Could not load EORE data:', err);
    document.querySelector('main').innerHTML = '<p style="padding:40px;color:#64748B">This dashboard is temporarily unavailable. Please try again shortly.</p>';
    return;
  }

  const t = data.totals;
  const kpiRow = document.getElementById('kpiRow');
  kpiRow.appendChild(kpiCard('Total beneficiaries reached', t.beneficiaries.toLocaleString(), 'Across ' + t.records.toLocaleString() + ' EORE reports'));
  kpiRow.appendChild(kpiCard('Total sessions delivered', t.sessions.toLocaleString(), ''));
  kpiRow.appendChild(kpiCard('Implementing partners', data.byOrg.length, 'Organisations reporting EORE activity'));
  kpiRow.appendChild(kpiCard('Girls & boys reached', (t.girls + t.boys).toLocaleString(), Math.round(100 * (t.girls + t.boys) / t.beneficiaries) + '% of all beneficiaries'));

  new Chart(document.getElementById('yearChart'), {
    type: 'bar',
    data: { labels: data.byYear.map(e => e.year), datasets: [{ label: 'Beneficiaries', data: data.byYear.map(e => e.total), backgroundColor: '#D97706' }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });

  new Chart(document.getElementById('genderChart'), {
    type: 'doughnut',
    data: {
      labels: ['Girls', 'Boys', 'Women', 'Men'],
      datasets: [{ data: [t.girls, t.boys, t.women, t.men], backgroundColor: ['#D97706', '#2F9D81', '#B91C1C', '#122A3D'] }]
    },
    options: { plugins: { legend: { position: 'bottom' } } }
  });

  const methodTop = topN(data.byMethod, 6);
  new Chart(document.getElementById('methodChart'), {
    type: 'bar',
    data: { labels: methodTop.map(e => e.key), datasets: [{ label: 'Reports', data: methodTop.map(e => e.value), backgroundColor: '#122A3D' }] },
    options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
  });

  const orgTop = topN(data.byOrg, 8);
  new Chart(document.getElementById('orgChart'), {
    type: 'bar',
    data: { labels: orgTop.map(e => e.key), datasets: [{ label: 'Beneficiaries', data: orgTop.map(e => e.value), backgroundColor: '#2F9D81' }] },
    options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
  });

  const stateTop = topN(data.byState, 8);
  new Chart(document.getElementById('stateChart'), {
    type: 'bar',
    data: { labels: stateTop.map(e => e.key), datasets: [{ label: 'Beneficiaries', data: stateTop.map(e => e.value), backgroundColor: '#0891B2' }] },
    options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
  });
}

init();
</script>
</body>
</html>
